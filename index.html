    // ==================== 清单操作 ====================
    function getCheckedCount(arr) {
        var c = 0;
        arr.forEach(function (item) { if (item) c++; });
        return c;
    }

    function updateChecklistStyle(checkbox, group, idx) {
        var label = checkbox.parentElement;
        if (checkbox.checked) label.classList.add('checked');
        else label.classList.remove('checked');

        // 更新对应进度
        var progressId = group + '-progress';
        var containerId = group === 'phase1' ? 'phase1-container' :
                          group === 'phase2' ? 'phase2-container' : 'material-container';

        // 收集所有该组 checkbox
        var allCb = [];
        if (group === 'phase1') {
            allCb = document.querySelectorAll('#phase1-container input[type="checkbox"]');
        } else if (group === 'phase2') {
            allCb = document.querySelectorAll('#phase2-container input[type="checkbox"], #phase2-container-b input[type="checkbox"], #phase2-container-c input[type="checkbox"]');
        } else {
            allCb = document.querySelectorAll('#material-container input[type="checkbox"]');
        }
        var done = 0;
        allCb.forEach(function (cb) { if (cb.checked) done++; });
        var el = document.getElementById(progressId);
        if (el) el.textContent = done + '/' + allCb.length;
    }

    function getChecklistData(group) {
        var result = [];
        var selector = '';
        if (group === 'phase1') selector = '#phase1-container input[type="checkbox"]';
        else if (group === 'phase2') selector = '#phase2-container input[type="checkbox"], #phase2-container-b input[type="checkbox"], #phase2-container-c input[type="checkbox"]';
        else selector = '#material-container input[type="checkbox"]';

        document.querySelectorAll(selector).forEach(function (cb) {
            result.push(cb.checked);
        });
        return result;
    }

    // ==================== 内业资料动态清单 ====================
    function renderMaterialItem(item, idx) {
        var checked = item.checked ? 'checked' : '';
        var cls = item.checked ? 'checked' : '';
        var html = '<div class="material-item-row" data-idx="' + idx + '" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">';
        html += '<label class="checklist-item ' + cls + '" style="flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;">';
        html += '<input type="checkbox" ' + checked + ' onchange="GreenApp.security.updateMaterialStyle(this)">';
        html += '<input type="text" class="form-input material-name" value="' + GreenApp.utils.escapeHtml(item.name || '') + '" placeholder="输入资料名称" style="border:none;background:transparent;flex:1;font-size:13px;">';
        html += '</label>';
        html += '<button type="button" class="btn-link danger" onclick="GreenApp.security.removeMaterialItem(' + idx + ')">删除</button>';
        html += '</div>';
        return html;
    }

    function addMaterialItem() {
        var container = document.getElementById('material-container');
        if (!container) return;
        var idx = container.querySelectorAll('.material-item-row').length;
        container.insertAdjacentHTML('beforeend', renderMaterialItem({ name: '', checked: false }, idx));
        updateMaterialProgress();
    }

    function removeMaterialItem(idx) {
        var row = document.querySelector('#material-container .material-item-row[data-idx="' + idx + '"]');
        if (row) row.remove();
        document.querySelectorAll('#material-container .material-item-row').forEach(function (r, i) {
            r.setAttribute('data-idx', i);
            r.querySelector('.btn-link.danger').setAttribute('onclick', 'GreenApp.security.removeMaterialItem(' + i + ')');
        });
        updateMaterialProgress();
    }

    function updateMaterialStyle(checkbox) {
        var label = checkbox.parentElement;
        if (checkbox.checked) label.classList.add('checked');
        else label.classList.remove('checked');
        updateMaterialProgress();
    }

    function updateMaterialProgress() {
        var rows = document.querySelectorAll('#material-container .material-item-row');
        var done = 0;
        rows.forEach(function (r) {
            if (r.querySelector('input[type="checkbox"]').checked) done++;
        });
        var el = document.getElementById('material-progress');
        if (el) el.textContent = done + '/' + rows.length;
    }

    function getMaterialData() {
        var result = [];
        document.querySelectorAll('#material-container .material-item-row').forEach(function (row) {
            result.push({
                name: row.querySelector('.material-name').value.trim(),
                checked: row.querySelector('input[type="checkbox"]').checked
            });
        });
        return result;
    }

    function toggleExpress() {
        var sel = document.getElementById('f-isExpress');
        if (!sel) return;
        document.getElementById('express-fields').style.display = (sel.value === '是' ? 'block' : 'none');
    }

    function getFormData() {
        var unpackData = GreenApp.app.getPhotoData('sec-unpack');

        return {
            month: document.getElementById('f-month').value,
            projectName: document.getElementById('f-projectName').value.trim(),
            phase: document.getElementById('f-phase').value,
            contactPerson: document.getElementById('f-contactPerson').value.trim(),
            operator: document.getElementById('f-operator').value.trim(),
            phase1Checklist: getChecklistData('phase1'),
            phase2Checklist: getChecklistData('phase2'),
            materialItems: getMaterialData(),
            submitTarget: document.getElementById('f-submitTarget').value.trim(),
            meetingTime: document.getElementById('f-meetingTime').value,
            meetingPlace: document.getElementById('f-meetingPlace').value.trim(),
            meetingHost: document.getElementById('f-meetingHost').value.trim(),
            meetingAttendees: document.getElementById('f-meetingAttendees').value.trim(),
            meetingContact: document.getElementById('f-meetingContact').value.trim(),
            meetingAgenda: document.getElementById('f-meetingAgenda').value.trim(),
            workReport: document.getElementById('f-workReport').value.trim(),
            inspectionResult: document.getElementById('f-inspectionResult').value.trim(),
            rectifyNoticeCount: parseInt(document.getElementById('f-rectifyNoticeCount').value) || 0,
            rectifyFeedbackCount: parseInt(document.getElementById('f-rectifyFeedbackCount').value) || 0,
            weekScore: document.getElementById('f-weekScore').value ? parseFloat(document.getElementById('f-weekScore').value) : null,
            scoreNotes: document.getElementById('f-scoreNotes').value.trim(),
            isExpress: (document.getElementById('f-isExpress') ? document.getElementById('f-isExpress').value : '否'),
            trackingNumber: document.getElementById('f-trackingNumber').value.trim(),
            expressCompany: document.getElementById('f-expressCompany').value.trim(),
            sendDate: document.getElementById('f-sendDate').value,
            receiveDate: document.getElementById('f-receiveDate').value,
            unpackPhoto: unpackData.photo,
            unpackPhotoName: unpackData.name,
            scanNotes: document.getElementById('f-scanNotes').value.trim(),
            remarks: document.getElementById('f-remarks').value.trim()
        };
    }

    // ==================== CRUD 操作 ====================
    function openCreate() {
        var html = getFormHTML({});
        var footer = '<button class="btn btn-default" onclick="GreenApp.closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="GreenApp.security.save()">保存</button>';
        GreenApp.app.openModal('新建安全内业记录', html, footer, 'modal-lg');
        // 延迟绑定照片上传
        setTimeout(function () { GreenApp.app.bindPhotoUpload('sec-unpack'); }, 100);
    }

    function openEdit(id) {
        var data = GreenApp.storage.getById('security', id);
        if (!data) return;
        var html = getFormHTML(data);
        var footer = '<button class="btn btn-default" onclick="GreenApp.closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="GreenApp.security.save(\'' + id + '\')">保存修改</button>';
        GreenApp.app.openModal('编辑安全内业记录', html, footer, 'modal-lg');
        setTimeout(function () { GreenApp.app.bindPhotoUpload('sec-unpack'); }, 100);
    }

    function openDetail(id) {
        var d = GreenApp.storage.getById('security', id);
        if (!d) return;

        var p1Done = getCheckedCount(d.phase1Checklist || []);
        var p2Done = getCheckedCount(d.phase2Checklist || []);

        var html = '';

        // 基本信息
        html += '<div class="detail-grid">';
        html += detailItem('月份', d.month);
        html += detailItem('项目名称', d.projectName);
        html += detailItem('当前阶段', '', false, statusTag(d.phase));
        html += detailItem('内业对接人', d.contactPerson);
        html += detailItem('经办人', d.operator);
        html += detailItem('特殊交送', d.submitTarget);
        html += '</div>';

        // 阶段一进度
        html += '<div class="form-section-title" style="margin-top:12px;">阶段一：催收与对接（' + p1Done + '/' + PHASE1_CHECKLIST.length + '）</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;">';
        PHASE1_CHECKLIST.forEach(function (item, idx) {
            var isChecked = d.phase1Checklist && d.phase1Checklist[idx];
            html += '<div style="font-size:13px;' + (isChecked ? 'color:#27ae60;text-decoration:line-through;' : '') + '">' + (isChecked ? '✅' : '⬜') + ' ' + item + '</div>';
        });
        html += '</div>';

        // 阶段二进度
        html += '<div class="form-section-title" style="margin-top:12px;">阶段二：纸质流转与签章（' + p2Done + '/' + PHASE2_CHECKLIST.length + '）</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;">';
        PHASE2_CHECKLIST.forEach(function (item, idx) {
            var isChecked = d.phase2Checklist && d.phase2Checklist[idx];
            html += '<div style="font-size:13px;' + (isChecked ? 'color:#27ae60;text-decoration:line-through;' : '') + '">' + (isChecked ? '✅' : '⬜') + ' ' + item + '</div>';
        });
        html += '</div>';

        // 内业资料
        var matItems = d.materialItems || [];
        var matDone = 0;
        matItems.forEach(function (it) { if (it.checked) matDone++; });
        html += '<div class="form-section-title" style="margin-top:12px;">内业资料核对清单（' + matDone + '/' + matItems.length + '）</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;">';
        matItems.forEach(function (it) {
            var isChecked = it.checked;
            html += '<div style="font-size:13px;' + (isChecked ? 'color:#27ae60;text-decoration:line-through;' : '') + '">' + (isChecked ? '✅' : '⬜') + ' ' + GreenApp.utils.escapeHtml(it.name || '') + '</div>';
        });
        html += '</div>';

        // 子记录
        if (d.meetingTime || d.workReport || d.inspectionResult) {
            html += '<div class="form-section-title" style="margin-top:12px;">相关文档</div>';
            html += '<div class="detail-grid">';
            if (d.meetingTime) html += detailItem('安全生产会时间', d.meetingTime);
            if (d.meetingPlace) html += detailItem('会议地点', d.meetingPlace);
            if (d.meetingHost) html += detailItem('主持', d.meetingHost);
            if (d.meetingAttendees) html += detailItem('参加人员', d.meetingAttendees);
            if (d.workReport) html += detailItem('工作报告摘要', d.workReport, true);
            if (d.inspectionResult) html += detailItem('检查结果', d.inspectionResult, true);
            if (d.rectifyNoticeCount) html += detailItem('整改通知单数', d.rectifyNoticeCount + ' 份');
            if (d.rectifyFeedbackCount) html += detailItem('整改反馈单数', d.rectifyFeedbackCount + ' 份');
            html += '</div>';
        }

        // 快递信息
        if (d.isExpress === '是') {
            html += '<div class="form-section-title" style="margin-top:12px;">快递信息</div>';
            html += '<div class="detail-grid">';
            html += detailItem('快递单号', d.trackingNumber);
            html += detailItem('快递公司', d.expressCompany);
            html += detailItem('发出日期', d.sendDate);
            html += detailItem('签收日期', d.receiveDate);
            html += '</div>';
            if (d.unpackPhoto) {
                html += '<div style="margin-top:8px;"><strong>拆封留底：</strong>';
                html += '<img src="' + d.unpackPhoto + '" style="max-width:200px;max-height:150px;border-radius:6px;cursor:pointer;" onclick="GreenApp.app.showImage(\'' + d.unpackPhoto + '\')"></div>';
            }
            if (d.scanNotes) html += detailItem('扫描件路径/备注', d.scanNotes, true);
        }

        html += '<div style="font-size:12px;color:#999;margin-top:12px;">创建：' + GreenApp.utils.formatDate(d.createdAt, true) + ' ｜ 修改：' + GreenApp.utils.formatDate(d.updatedAt, true) + '</div>';

        var footer = '<button class="btn btn-default" onclick="GreenApp.closeModal()">关闭</button>' +
            '<button class="btn btn-primary" onclick="GreenApp.closeModal();GreenApp.security.openEdit(\'' + id + '\')">编辑</button>';
        GreenApp.app.openModal('安全内业详情', html, footer, 'modal-lg');
    }

    function detailItem(label, value, full, customHTML) {
        return '<div class="detail-item' + (full ? ' detail-full' : '') + '">' +
            '<div class="detail-label">' + label + '</div>' +
            '<div class="detail-value">' + (customHTML || GreenApp.utils.escapeHtml(value || '-')) + '</div>' +
            '</div>';
    }

    function save(id) {
        var data = getFormData();
        if (!data.month) {
            GreenApp.utils.toast('请选择月份', 'error');
            return;
        }
        if (!data.projectName) {
            GreenApp.utils.toast('请填写项目名称', 'error');
            return;
        }
        if (id) data.id = id;
        GreenApp.storage.save('security', data);
        GreenApp.closeModal();
        GreenApp.utils.toast('保存成功', 'success');
        render();
    }

    function deleteRecord(id) {
        var d = GreenApp.storage.getById('security', id);
        if (!d) return;
        GreenApp.utils.confirm('确认删除安全内业记录「' + (d.month || '') + ' ' + (d.projectName || '') + '」？此操作不可撤销。', function () {
            GreenApp.storage.remove('security', id);
            GreenApp.utils.toast('已删除', 'success');
            render();
        });
    }

    // ==================== 导出 CSV ====================
    function exportCSV() {
        var list = GreenApp.storage.getAll('security');
        if (list.length === 0) {
            GreenApp.utils.toast('暂无数据可导出', 'warning');
            return;
        }
        var headers = ['月份', '项目名称', '当前阶段', '内业对接人', '经办人', '阶段一进度', '阶段二进度', '资料齐全', '特殊交送', '是否快递', '快递单号', '发出日期', '签收日期', '备注', '创建时间', '修改时间'];
        var rows = list.map(function (s) {
            var p1 = getCheckedCount(s.phase1Checklist || []);
            var p2 = getCheckedCount(s.phase2Checklist || []);
            var items = s.materialItems || [];
            var mat = 0;
            items.forEach(function (it) { if (it.checked) mat++; });
            return [s.month, s.projectName, s.phase, s.contactPerson, s.operator,
                p1 + '/' + PHASE1_CHECKLIST.length, p2 + '/' + PHASE2_CHECKLIST.length,
                mat + '/' + items.length, s.submitTarget, (s.isExpress || '否'),
                s.trackingNumber, s.sendDate, s.receiveDate, s.remarks, s.createdAt, s.updatedAt];
        });
        GreenApp.utils.exportCSV('安全内业_' + GreenApp.utils.today() + '.csv', headers, rows);
        GreenApp.utils.toast('导出成功', 'success');
    }

    // ==================== 状态标签 ====================
    function statusTag(phase) {
        var cls = 'tag-default';
        if (phase === '催收对接中') cls = 'tag-info';
        else if (phase === '纸质流转中') cls = 'tag-warning';
        else if (phase === '用印存档中') cls = 'tag-primary';
        else if (phase === '已完成') cls = 'tag-success';
        return '<span class="tag ' + cls + '">' + GreenApp.utils.escapeHtml(phase || '-') + '</span>';
    }

    return {
        render: render,
        onSearch: onSearch,
        onFilter: onFilter,
        openCreate: openCreate,
        openEdit: openEdit,
        openDetail: openDetail,
        save: save,
        delete: deleteRecord,
        exportCSV: exportCSV,
        updateChecklistStyle: updateChecklistStyle,
        addMaterialItem: addMaterialItem,
        removeMaterialItem: removeMaterialItem,
        updateMaterialStyle: updateMaterialStyle,
        toggleExpress: toggleExpress
    };
})();

    function renderReviewSection(list) {
        if (list.length === 0) return '';

        var html = '<div class="panel"><div class="panel-header"><h3>每日随机复习</h3>' +
            '<button class="btn btn-sm btn-default" onclick="GreenApp.plants.render()">换一批</button></div>';
        html += '<div class="panel-body">';

        // 随机抽取1-3种，优先抽取非"熟练识别"的
        var needReview = list.filter(function (p) { return p.learningStatus !== '熟练识别'; });
        var pool = needReview.length > 0 ? needReview : list;
        var count = Math.min(pool.length, Math.floor(Math.random() * 3) + 1);
        var shuffled = pool.slice().sort(function () { return Math.random() - 0.5; });
        var selected = shuffled.slice(0, count);

        html += '<p style="margin-bottom:12px;color:#666;font-size:13px;">今日抽取 ' + count + ' 种植物，先尝试回忆，再点击查看答案。</p>';

        selected.forEach(function (p, idx) {
            var photoHTML = '';
            if (p.photo) {
                photoHTML = '<div class="review-card-photo"><img src="' + p.photo + '" onclick="GreenApp.app.showImage(\'' + p.photo + '\')"></div>';
            } else {
                photoHTML = '<div class="review-card-photo"><span style="font-size:48px;opacity:0.2;">🌿</span></div>';
            }

            html += '<div class="review-card" id="plant-review-' + idx + '" style="text-align:left;">';
            html += '<div style="display:flex;gap:20px;align-items:flex-start;">';
            html += photoHTML;
            html += '<div style="flex:1;">';
            html += '<div class="review-card-question">这是什么植物？</div>';
            html += '<div id="plant-review-answer-' + idx + '" style="display:none;">';
            html += '<div class="review-card-answer" style="text-align:left;">' + GreenApp.utils.escapeHtml(p.chineseName) + '</div>';
            html += '<div class="review-card-sci" style="text-align:left;">' + GreenApp.utils.escapeHtml(p.scientificName || '') + '</div>';
            html += '<div style="font-size:13px;color:#666;margin-bottom:8px;">' + GreenApp.utils.escapeHtml(p.family || '') + ' · ' + GreenApp.utils.escapeHtml(p.genus || '') + ' · ' + GreenApp.utils.escapeHtml(p.plantType || '') + '</div>';
            if (p.identificationFeatures) {
                html += '<div style="font-size:13px;color:#666;margin-bottom:8px;"><strong>识别特征：</strong>' + GreenApp.utils.escapeHtml(p.identificationFeatures) + '</div>';
            }
            html += '<div class="review-actions" style="justify-content:flex-start;">';
            html += '<button class="btn btn-success btn-sm" onclick="GreenApp.plants.markReview(\'' + p.id + '\', true)">已掌握</button>';
            html += '<button class="btn btn-default btn-sm" onclick="GreenApp.plants.markReview(\'' + p.id + '\', false)">需要继续复习</button>';
            html += '</div>';
            html += '</div>';
            html += '<button class="btn btn-primary btn-sm" id="plant-review-show-' + idx + '" onclick="GreenApp.plants.showReviewAnswer(' + idx + ')">显示答案</button>';
            html += '</div></div></div>';
        });

        html += '</div></div>';
        return html;
    }

    function showReviewAnswer(idx) {
        document.getElementById('plant-review-answer-' + idx).style.display = 'block';
        document.getElementById('plant-review-show-' + idx).style.display = 'none';
    }

    function markReview(plantId, mastered) {
        var plant = GreenApp.storage.getById('plants', plantId);
        if (plant) {
            if (mastered) {
                plant.learningStatus = '熟练识别';
                GreenApp.storage.save('plants', plant);
                GreenApp.utils.toast('已标记为「熟练识别」', 'success');
            } else {
                if (plant.learningStatus === '待学习') {
                    plant.learningStatus = '初步认识';
                    GreenApp.storage.save('plants', plant);
                }
                GreenApp.utils.toast('已标记为「需要继续复习」', 'info');
            }
        }
        render();
    }

    function getUniqueFamilies(list) {
        var families = {};
        list.forEach(function (p) {
            if (p.family) families[p.family] = true;
        });
        return Object.keys(families).sort();
    }

    function filterList(list) {
        return list.filter(function (p) {
            var matchSearch = true;
            if (state.search) {
                var s = state.search.toLowerCase();
                matchSearch = (p.chineseName && p.chineseName.toLowerCase().indexOf(s) !== -1) ||
                    (p.scientificName && p.scientificName.toLowerCase().indexOf(s) !== -1) ||
                    (p.alias && p.alias.toLowerCase().indexOf(s) !== -1);
            }
            var matchType = !state.typeFilter || p.plantType === state.typeFilter;
            var matchFamily = !state.familyFilter || p.family === state.familyFilter;
            var matchStatus = !state.statusFilter || p.learningStatus === state.statusFilter;
            return matchSearch && matchType && matchFamily && matchStatus;
        });
    }

    function onSearch(val) {
        state.search = val;
        render();
    }

    function onFilter(type, val) {
        if (type === 'type') state.typeFilter = val;
        if (type === 'family') state.familyFilter = val;
        if (type === 'status') state.statusFilter = val;
        render();
    }

    function switchView(view) {
        state.view = view;
        render();
    }

/**
 * 绿化管理工作台 - 云端同步层 (PocketBase)
 * 
 * 使用 PocketBase 实现多设备数据实时同步
 * 电脑和手机通过同一 PocketBase 服务器共享数据
 */
var GreenApp = GreenApp || {};

GreenApp.cloud = (function () {
    var PB_URL = '';
    var isConnected = false;
    var pb = null;
    var syncMode = 'local'; // 'local' | 'cloud'
    var listeners = [];

    // 模块名到 PocketBase 集合名的映射
    var COLLECTION_MAP = {
        tasks: 'tasks',
        inspection: 'inspection',
        seedling: 'seedling',
        payment: 'payment',
        plants: 'plants',
        security: 'security'
    };

    /**
     * 初始化云端连接
     * @param {string} url - PocketBase 服务器地址，如 http://192.168.1.100:8091
     */
    function init(url) {
        if (!url) {
            // 尝试从设置中读取
            var settings = GreenApp.storage.getSettings();
            url = settings.cloudUrl || '';
        }
        
        if (!url) {
            isConnected = false;
            syncMode = 'local';
            notifyListeners({ type: 'status', connected: false, mode: 'local' });
            return false;
        }

        PB_URL = url.replace(/\/+$/, '');
        
        try {
            // 动态加载 PocketBase SDK
            if (typeof PocketBase === 'undefined') {
                loadPBSDK(url);
                return true; // 异步加载中
            }
            
            pb = new PocketBase(PB_URL);
            isConnected = true;
            syncMode = 'cloud';
            
            // 保存设置
            saveCloudUrl(url);
            
            notifyListeners({ type: 'status', connected: true, mode: 'cloud', url: PB_URL });
            console.log('[Cloud] 已连接到', PB_URL);
            return true;
        } catch (e) {
            console.error('[Cloud] 连接失败:', e);
            isConnected = false;
            syncMode = 'local';
            notifyListeners({ type: 'status', connected: false, error: e.message });
            return false;
        }
    }

    /**
     * 加载 PocketBase JS SDK
     */
    function loadPBSDK(baseUrl) {
        var script = document.createElement('script');
        script.src = baseUrl + '/api/pb.js';
        script.onload = function () {
            pb = new PocketBase(PB_URL);
            isConnected = true;
            syncMode = 'cloud';
            saveCloudUrl(PB_URL);
            notifyListeners({ type: 'status', connected: true, mode: 'cloud', url: PB_URL });
            console.log('[Cloud] SDK 加载完成，已连接');
            
            // 重新渲染当前页面以加载云端数据
            var currentPage = document.querySelector('.page.active');
            if (currentPage) {
                var pageName = currentPage.id.replace('page-', '');
                if (GreenApp[pageName] && typeof GreenApp[pageName].render === 'function') {
                    GreenApp[pageName].render();
                }
            }
        };
        script.onerror = function () {
            console.error('[Cloud] SDK 加载失败，请确认 PocketBase 服务器正在运行');
            isConnected = false;
            syncMode = 'local';
            notifyListeners({ type: 'status', connected: false, error: 'SDK加载失败' });
        };
        document.head.appendChild(script);
    }

    /**
     * 断开云端连接
     */
    function disconnect() {
        if (pb) {
            // 取消所有实时订阅
            try {
                pb.realtime.unsubscribe();
            } catch (e) {}
            pb = null;
        }
        isConnected = false;
        syncMode = 'local';
        PB_URL = '';
        saveCloudUrl('');
        notifyListeners({ type: 'status', connected: false, mode: 'local' });
    }

    /**
     * 获取当前模式
     */
    function getMode() {
        return syncMode;
    }

    /**
     * 是否已连接
     */
    function isOnline() {
        return isConnected && syncMode === 'cloud';
    }

    // ==================== CRUD 操作 ====================

    /**
     * 获取所有记录（优先从云端）
     * @param {string} module - 模块名
     * @returns {Promise<Array>}
     */
    async function getAll(module) {
        if (!isOnline()) {
            // 本地模式：直接返回 localStorage 数据
            return GreenApp.storage.getAll(module);
        }

        try {
            var collection = COLLECTION_MAP[module];
            if (!collection) return [];
            
            var records = await pb.collection(collection).getFullList(200, {
                sort: '-createdAt'
            });
            
            // 转换为本地格式（去除 PocketBase 系统字段）
            return records.map(function (r) {
                var obj = { id: r.id };
                Object.keys(r).forEach(function (key) {
                    if (!['id', 'collectionId', 'collectionName', 'created', 'updated'].includes(key)) {
                        obj[key] = r[key];
                    }
                });
                return obj;
            });
        } catch (e) {
            console.error('[Cloud] 获取' + module + '数据失败:', e);
            // 降级到本地数据
            return GreenApp.storage.getAll(module);
        }
    }

    /**
     * 获取单条记录
     */
    async function getOne(module, id) {
        if (!isOnline()) {
            return GreenApp.storage.getOne(module, id);
        }

        try {
            var collection = COLLECTION_MAP[module];
            var record = await pb.collection(collection).getOne(id);
            var obj = { id: record.id };
            Object.keys(record).forEach(function (key) {
                if (!['id', 'collectionId', 'collectionName', 'created', 'updated'].includes(key)) {
                    obj[key] = record[key];
                }
            });
            return obj;
        } catch (e) {
            return null;
        }
    }

    /**
     * 新增记录
     */
    async function add(module, data) {
        // 确保时间戳
        var now = new Date().toISOString();
        data.createdAt = data.createdAt || now;
        data.updatedAt = now;

        if (!isOnline()) {
            var id = GreenApp.storage.add(module, data);
            return id;
        }

        try {
            var collection = COLLECTION_MAP[module];
            var record = await pb.collection(collection).create(data);
            
            // 同时保存到本地作为缓存
            GreenApp.storage.add(module, Object.assign({}, data, { id: record.id }));
            
            return record.id;
        } catch (e) {
            console.error('[Cloud] 新增' + module + '记录失败:', e);
            // 降级到本地
            return GreenApp.storage.add(module, data);
        }
    }

    /**
     * 更新记录
     */
    async function update(module, id, data) {
        data.updatedAt = new Date().toISOString();

        if (!isOnline()) {
            return GreenApp.storage.update(module, id, data);
        }

        try {
            var collection = COLLECTION_MAP[module];
            await pb.collection(collection).update(id, data);
            
            // 同步更新本地缓存
            GreenApp.storage.update(module, id, data);
            
            return true;
        } catch (e) {
            console.error('[Cloud] 更新' + module + '记录失败:', e);
            return GreenApp.storage.update(module, id, data);
        }
    }

    /**
     * 删除记录
     */
    async function remove(module, id) {
        if (!isOnline()) {
            return GreenApp.storage.remove(module, id);
        }

        try {
            var collection = COLLECTION_MAP[module];
            await pb.collection(collection).delete(id);
            
            // 同步删除本地缓存
            GreenApp.storage.remove(module, id);
            
            return true;
        } catch (e) {
            console.error('[Cloud] 删除' + module + '记录失败:', e);
            return GreenApp.storage.remove(module, id);
        }
    }

    // ==================== 批量操作 ====================

    /**
     * 将本地数据推送到云端
     */
    async function pushToCloud() {
        if (!isOnline()) {
            GreenApp.utils.toast('未连接到云端服务器', 'error');
            return false;
        }

        var modules = ['tasks', 'inspection', 'seedling', 'payment', 'plants', 'security'];
        var totalPushed = 0;

        for (var i = 0; i < modules.length; i++) {
            var mod = modules[i];
            var localData = GreenApp.storage.getAll(mod);
            
            for (var j = 0; j < localData.length; j++) {
                var item = localData[j];
                try {
                    var collection = COLLECTION_MAP[mod];
                    // 检查是否已存在
                    var existing = null;
                    try {
                        existing = await pb.collection(collection).getOne(item.id);
                    } catch (e) {}
                    
                    if (existing) {
                        // 更新
                        var updateData = Object.assign({}, item);
                        delete updateData.id;
                        await pb.collection(collection).update(item.id, updateData);
                    } else {
                        // 新增
                        var createData = Object.assign({}, item);
                        delete createData.id;
                        await pb.collection(collection).create(createData);
                    }
                    totalPushed++;
                } catch (e) {
                    console.error('[Cloud] 推送记录失败:', mod, item.id, e);
                }
            }
        }

        GreenApp.utils.toast('已推送 ' + totalPushed + ' 条数据到云端', 'success');
        return true;
    }

    /**
     * 从云端拉取数据到本地
     */
    async function pullFromCloud() {
        if (!isOnline()) {
            GreenApp.utils.toast('未连接到云端服务器', 'error');
            return false;
        }

        var modules = ['tasks', 'inspection', 'seedling', 'payment', 'plants', 'security'];
        var totalPulled = 0;

        for (var i = 0; i < modules.length; i++) {
            var mod = modules[i];
            try {
                var cloudData = await getAll(mod);
                
                // 清空本地数据并用云端数据替换
                GreenApp.storage.set(GreenApp.storage.KEYS[mod], cloudData);
                totalPulled += cloudData.length;
            } catch (e) {
                console.error('[Cloud] 拉取' + mod + '数据失败:', e);
            }
        }

        GreenApp.utils.toast('已从云端拉取 ' + totalPulled + ' 条数据', 'success');
        
        // 重新渲染当前页面
        var currentPage = document.querySelector('.page.active');
        if (currentPage) {
            var pageName = currentPage.id.replace('page-', '');
            if (GreenApp[pageName] && typeof GreenApp[pageName].render === 'function') {
                GreenApp[pageName].render();
            }
        }
        
        return true;
    }

    // ==================== 实时订阅 ====================

    /**
     * 订阅某模块的数据变更
     */
    function subscribe(module, callback) {
        if (!isOnline() || !pb) return;

        var collection = COLLECTION_MAP[module];
        if (!collection) return;

        try {
            // PocketBase 实时订阅
            pb.collection(collection).subscribe('*', function (e) {
                callback({
                    action: e.action,
                    record: e.record
                });
            });
        } catch (e) {
            console.error('[Cloud] 订阅' + module + '失败:', e);
        }
    }

    // ==================== 工具函数 ====================

    function saveCloudUrl(url) {
        var settings = GreenApp.storage.getSettings();
        settings.cloudUrl = url;
        settings.syncMode = url ? 'cloud' : 'local';
        GreenApp.storage.set(GreenApp.storage.KEYS.settings, settings);
    }

    function getCloudUrl() {
        var settings = GreenApp.storage.getSettings();
        return settings.cloudUrl || '';
    }

    function notifyListeners(event) {
        listeners.forEach(function (fn) {
            try { fn(event); } catch (e) {}
        });
    }

    function onStatusChange(callback) {
        listeners.push(callback);
    }

    /**
     * 测试连接
     */
    async function testConnection(url) {
        try {
            var testUrl = url.replace(/\/+$/, '');
            var resp = await fetch(testUrl + '/api/health');
            if (resp.ok) {
                return { success: true, message: '连接成功！' };
            }
            return { success: false, message: '服务器响应异常 (' + resp.status + ')' };
        } catch (e) {
            return { success: false, message: '无法连接: ' + e.message };
        }
    }

    return {
        init: init,
        disconnect: disconnect,
        getMode: getMode,
        isOnline: isOnline,
        getAll: getAll,
        getOne: getOne,
        add: add,
        update: update,
        remove: remove,
        pushToCloud: pushToCloud,
        pullFromCloud: pullFromCloud,
        subscribe: subscribe,
        getCloudUrl: getCloudUrl,
        saveCloudUrl: saveCloudUrl,
        testConnection: testConnection,
        onStatusChange: onStatusChange,
        COLLECTION_MAP: COLLECTION_MAP
    };
})();

        html += '<p>2. 双击运行 <code style="background:var(--bg-light);padding:2px 6px;border-radius:4px;">start-pocketbase.bat</code></p>';
        html += '<p>3. 首次运行会提示设置管理员账号（已预设：admin@greening.local）</p>';
        html += '<p>4. 手机和电脑在同一局域网时，使用电脑 IP 地址访问</p>';
        html += '<p style="color:var(--danger);">注意：服务器必须保持运行才能同步数据</p>';
        html += '</div></details>';
        html += '</div>';

        // 分模块导出CSV
        html += '<div class="settings-section">';
        html += '<h3>分模块导出 CSV</h3>';
        html += '<div class="settings-row"><div class="settings-row-label">今日工作</div><button class="btn btn-default" onclick="GreenApp.tasks.exportCSV()">导出 CSV</button></div>';
        html += '<div class="settings-row"><div class="settings-row-label">巡查整改</div><button class="btn btn-default" onclick="GreenApp.inspection.exportCSV()">导出 CSV</button></div>';
        html += '<div class="settings-row"><div class="settings-row-label">占绿移植</div><button class="btn btn-default" onclick="GreenApp.seedling.exportCSV()">导出 CSV</button></div>';
        html += '<div class="settings-row"><div class="settings-row-label">请款核对</div><button class="btn btn-default" onclick="GreenApp.payment.exportCSV()">导出 CSV</button></div>';
        html += '<div class="settings-row"><div class="settings-row-label">安全内业</div><button class="btn btn-default" onclick="GreenApp.security.exportCSV()">导出 CSV</button></div>';
        html += '<div class="settings-row"><div class="settings-row-label">植物学习</div><button class="btn btn-default" onclick="GreenApp.plants.exportCSV()">导出 CSV</button></div>';
        html += '</div>';

        // 示例数据管理
        html += '<div class="settings-section">';
        html += '<h3>示例数据管理</h3>';
        html += '<div class="settings-row">';
        html += '<div><div class="settings-row-label">清空示例数据</div><div class="settings-row-desc">删除所有模块数据，清空后可恢复示例数据</div></div>';
        html += '<button class="btn btn-danger" onclick="GreenApp.settings.clearAll()">清空所有数据</button>';
        html += '</div>';
        html += '<div class="settings-row">';
        html += '<div><div class="settings-row-label">恢复示例数据</div><div class="settings-row-desc">重新载入预置的示例数据，将覆盖当前所有数据</div></div>';
        html += '<button class="btn btn-default" onclick="GreenApp.settings.restoreSamples()">恢复示例数据</button>';
        html += '</div>';
        html += '</div>';

        // 关于
        html += '<div class="settings-section">';
        html += '<h3>关于</h3>';
        html += '<div class="settings-row"><div class="settings-row-label">系统名称</div><div>绿化管理工作台</div></div>';
        html += '<div class="settings-row"><div class="settings-row-label">版本</div><div>1.0.0</div></div>';
        html += '<div class="settings-row"><div class="settings-row-label">数据存储位置</div><div>浏览器本地存储 (localStorage)</div></div>';
        html += '<div class="settings-row"><div class="settings-row-label">技术架构</div><div>HTML + CSS + JavaScript (纯前端，无需服务器)</div></div>';
        html += '</div>';

        document.getElementById('page-settings').innerHTML = html;
    }

    function saveBasic() {
        var settings = {
            userName: document.getElementById('set-userName').value.trim(),
            department: document.getElementById('set-department').value.trim(),
            defaultProject: document.getElementById('set-defaultProject').value.trim()
        };
        GreenApp.storage.saveSettings(settings);
        GreenApp.app.renderSidebarFooter();
        GreenApp.utils.toast('设置已保存', 'success');
    }

    function exportAll() {
        var data = GreenApp.storage.exportAll();
        GreenApp.utils.exportJSON('绿化管理工作台_备份_' + GreenApp.utils.today() + '.json', data);
        GreenApp.utils.toast('备份文件已下载', 'success');
    }

    function copyToClipboard() {
        var data = GreenApp.storage.exportAll();
        var json = JSON.stringify(data, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(function () {
                GreenApp.utils.toast('已复制到剪贴板！请在手机端粘贴导入', 'success');
            }).catch(function () {
                fallbackCopy(json);
            });
        } else {
            fallbackCopy(json);
        }
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            GreenApp.utils.toast('已复制到剪贴板！请在手机端粘贴导入', 'success');
        } catch (e) {
            GreenApp.utils.toast('复制失败，请手动复制', 'error');
        }
        document.body.removeChild(ta);
    }

    function showPasteImport() {
        var area = document.getElementById('paste-import-area');
        area.style.display = area.style.display === 'none' ? 'block' : 'none';
        if (area.style.display === 'block') {
            document.getElementById('paste-import-text').focus();
        }
    }

    function importFromPaste() {
        var text = document.getElementById('paste-import-text').value.trim();
        if (!text) {
            GreenApp.utils.toast('请先粘贴 JSON 内容', 'error');
            return;
        }
        try {
            var data = JSON.parse(text);
            GreenApp.utils.confirm('导入备份将覆盖当前所有数据，确认继续？', function () {
                var success = GreenApp.storage.importAll(data);
                if (success) {
                    GreenApp.utils.toast('数据导入成功', 'success');
                    document.getElementById('paste-import-area').style.display = 'none';
                    document.getElementById('paste-import-text').value = '';
                    GreenApp.app.renderSidebarFooter();
                    GreenApp.app.navigate(GreenApp.app.getCurrentPage());
                } else {
                    GreenApp.utils.toast('导入失败：文件格式不正确', 'error');
                }
            });
        } catch (err) {
            GreenApp.utils.toast('导入失败：JSON 格式不正确，请检查内容是否完整', 'error');
        }
    }

    function importAll(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            try {
                var data = JSON.parse(e.target.result);
                GreenApp.utils.confirm('导入备份将覆盖当前所有数据，确认继续？', function () {
                    var success = GreenApp.storage.importAll(data);
                    if (success) {
                        GreenApp.utils.toast('数据导入成功', 'success');
                        GreenApp.app.renderSidebarFooter();
                        GreenApp.app.navigate(GreenApp.app.getCurrentPage());
                    } else {
                        GreenApp.utils.toast('导入失败：文件格式不正确', 'error');
                    }
                });
            } catch (err) {
                GreenApp.utils.toast('导入失败：无法解析JSON文件', 'error');
            }
            input.value = '';
        };
        reader.readAsText(file);
    }

    function clearAll() {
        GreenApp.utils.confirm('确认清空所有数据？此操作将删除所有模块的全部记录，不可撤销！\n\n建议在清空前先导出备份。', function () {
            GreenApp.storage.clearAll();
            GreenApp.utils.toast('所有数据已清空', 'success');
            GreenApp.app.navigate(GreenApp.app.getCurrentPage());
        }, '危险操作');
    }

    function restoreSamples() {
        GreenApp.utils.confirm('恢复示例数据将覆盖当前所有数据，确认继续？', function () {
            GreenApp.data.restoreSamples();
            GreenApp.utils.toast('示例数据已恢复', 'success');
            GreenApp.app.renderSidebarFooter();
            GreenApp.app.navigate(GreenApp.app.getCurrentPage());
        });
    }

    // ===== 云端同步 =====

    async function connectCloud() {
        var url = document.getElementById('set-cloudUrl').value.trim();
        if (!url) {
            GreenApp.utils.toast('请输入服务器地址', 'error');
            return;
        }
        
        // 显示连接中状态
        document.getElementById('cloud-status-desc').innerHTML = '<span style="color:var(--warning);">正在连接...</span>';
        document.getElementById('cloud-status-badge').className = 'tag tag-warning';
        document.getElementById('cloud-status-badge').textContent = '连接中';
        
        var result = await GreenApp.cloud.testConnection(url);
        if (result.success) {
            GreenApp.cloud.init(url);
            GreenApp.utils.toast(result.message, 'success');
            render(); // 刷新设置页面
        } else {
            document.getElementById('cloud-status-desc').innerHTML = '<span style="color:var(--danger);">连接失败</span>';
            document.getElementById('cloud-status-badge').className = 'tag tag-danger';
            document.getElementById('cloud-status-badge').textContent = '失败';
            GreenApp.utils.toast(result.message, 'error');
        }
    }

    function disconnectCloud() {
        GreenApp.utils.confirm('确认断开云端连接？断开后将使用本地存储。', function () {
            GreenApp.cloud.disconnect();
            GreenApp.utils.toast('已断开云端连接，切换到本地模式', 'success');
            render();
        });
    }

    async function pushToCloud() {
        await GreenApp.cloud.pushToCloud();
    }

    async function pullFromCloud() {
        await GreenApp.cloud.pullFromCloud();
    }

    return {
        render: render,
        saveBasic: saveBasic,
        exportAll: exportAll,
        copyToClipboard: copyToClipboard,
        showPasteImport: showPasteImport,
        importFromPaste: importFromPaste,
        importAll: importAll,
        clearAll: clearAll,
        restoreSamples: restoreSamples,
        connectCloud: connectCloud,
        disconnectCloud: disconnectCloud,
        pushToCloud: pushToCloud,
        pullFromCloud: pullFromCloud
    };
})();

</script>
