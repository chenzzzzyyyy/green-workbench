<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿化管理工作台</title>
    <meta name="theme-color" content="#2d5f3f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="绿化管理">
    <meta name="application-name" content="绿化管理">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="绿化管理">
    <style>
/* ===== 基础重置 ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #2d5a27;
    --primary-light: #3a7d34;
    --primary-lighter: #4a9d44;
    --primary-bg: #e8f5e3;
    --primary-bg-light: #f0f8ec;
    --bg: #f5f6f8;
    --bg-white: #ffffff;
    --border: #e0e0e0;
    --border-light: #ebebeb;
    --text: #333333;
    --text-secondary: #666666;
    --text-light: #999999;
    --danger: #dc3545;
    --danger-bg: #fdf0f0;
    --warning: #e8922d;
    --warning-bg: #fef6ec;
    --success: #28a745;
    --success-bg: #f0faf2;
    --info: #2196f3;
    --info-bg: #e8f4fd;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.1);
    --radius: 6px;
    --radius-sm: 4px;
    --sidebar-width: 220px;
}

body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    overflow-x: hidden;
}

/* ===== 布局 ===== */
.app-container {
    display: flex;
    min-height: 100vh;
}

/* ===== 侧边栏 ===== */
.sidebar {
    width: var(--sidebar-width);
    background: linear-gradient(180deg, #1e3d1a 0%, #2d5a27 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 100;
}

.sidebar-header {
    padding: 22px 20px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-logo-icon {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    flex-shrink: 0;
}

.sidebar-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
}

.sidebar-nav {
    flex: 1;
    padding: 10px 0;
    overflow-y: auto;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
}

.nav-item:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
}

.nav-item.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border-left-color: #8bc34a;
}

.nav-icon {
    width: 24px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
}

.nav-item.active .nav-icon {
    background: rgba(255, 255, 255, 0.25);
}

.sidebar-footer {
    padding: 14px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    line-height: 1.8;
}

/* ===== 主内容区 ===== */
.main-content {
    flex: 1;
    margin-left: var(--sidebar-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.topbar {
    background: var(--bg-white);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 6px;
    border-radius: 4px;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

.sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 99;
    opacity: 0;
    transition: opacity 0.25s;
}

.sidebar-backdrop.show {
    display: block;
    opacity: 1;
}

.page-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
}

.topbar-date {
    font-size: 13px;
    color: var(--text-secondary);
}

.page-content {
    flex: 1;
    padding: 20px 24px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* ===== 统计卡片 ===== */
.stat-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
}

.stat-card {
    background: var(--bg-white);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 14px;
}

.stat-card-icon {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
}

.stat-card-icon.green { background: var(--primary-bg); color: var(--primary); }
.stat-card-icon.orange { background: var(--warning-bg); color: var(--warning); }
.stat-card-icon.blue { background: var(--info-bg); color: var(--info); }
.stat-card-icon.teal { background: #e0f2f1; color: #00695c; }

.stat-card-info h3 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text);
}

.stat-card-info p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
}

/* ===== 面板 ===== */
.panel {
    background: var(--bg-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 16px;
}

.panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.panel-header h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.panel-header h3::before {
    content: '';
    width: 3px;
    height: 16px;
    background: var(--primary);
    border-radius: 2px;
}

.panel-body {
    padding: 16px 20px;
}

.panel-body.no-padding {
    padding: 0;
}

/* ===== 快捷按钮 ===== */
.quick-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.quick-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: all 0.2s;
}

.quick-btn:hover {
    background: var(--primary-bg);
    border-color: var(--primary-light);
    color: var(--primary);
}

.quick-btn .qb-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: var(--primary-bg);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

/* ===== 按钮 ===== */
.btn {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg-white);
    color: var(--text);
    font-family: inherit;
    white-space: nowrap;
}

.btn:hover {
    border-color: var(--primary-light);
    color: var(--primary);
}

.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
}

.btn-primary:hover {
    background: var(--primary-light);
    border-color: var(--primary-light);
    color: #fff;
}

.btn-danger {
    color: var(--danger);
    border-color: #f5c6cb;
    background: var(--bg-white);
}

.btn-danger:hover {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
}

.btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
}

.btn-success:hover {
    background: #218838;
    border-color: #218838;
    color: #fff;
}

.btn-default {
    background: var(--bg-white);
    border-color: var(--border);
    color: var(--text-secondary);
}

.btn-sm {
    padding: 4px 10px;
    font-size: 12px;
}

.btn-link {
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 13px;
}

.btn-link:hover {
    text-decoration: underline;
}

.btn-link.danger {
    color: var(--danger);
}

/* ===== 工具栏 ===== */
.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    flex-wrap: wrap;
}

.toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-box {
    position: relative;
    width: 260px;
}

.search-box input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
}

.search-box input:focus {
    border-color: var(--primary-light);
}

.search-box::before {
    content: '🔍';
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.5;
}

.filter-select {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg-white);
    color: var(--text);
    cursor: pointer;
    outline: none;
    min-width: 120px;
}

.filter-select:focus {
    border-color: var(--primary-light);
}

/* ===== 表格 ===== */
.table-wrapper {
    overflow-x: auto;
}

table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

table.data-table th {
    background: #f8f9fa;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    font-size: 12px;
}

table.data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-light);
    color: var(--text);
    vertical-align: middle;
}

table.data-table tr:hover td {
    background: #fafbfc;
}

table.data-table tr:last-child td {
    border-bottom: none;
}

.td-actions {
    white-space: nowrap;
    text-align: right;
}

.td-actions .btn-link {
    margin-left: 4px;
}

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
}

.empty-state-icon {
    font-size: 36px;
    margin-bottom: 10px;
    opacity: 0.3;
}

/* ===== 标签/徽章 ===== */
.tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.6;
    white-space: nowrap;
}

.tag-default { background: #f0f0f0; color: #666; }
.tag-primary { background: var(--primary-bg); color: var(--primary); }
.tag-warning { background: var(--warning-bg); color: var(--warning); }
.tag-danger { background: var(--danger-bg); color: var(--danger); }
.tag-success { background: var(--success-bg); color: var(--success); }
.tag-info { background: var(--info-bg); color: var(--info); }

/* 紧急程度 */
.urgency-normal { color: var(--text-secondary); }
.urgency-important { color: var(--warning); font-weight: 600; }
.urgency-urgent { color: var(--danger); font-weight: 600; }

/* ===== 模态框 ===== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    align-items: flex-start;
    justify-content: center;
    z-index: 1000;
    padding-top: 40px;
    overflow-y: auto;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: var(--bg-white);
    border-radius: 8px;
    width: 700px;
    max-width: 90%;
    max-height: calc(100vh - 80px);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
    margin-bottom: 40px;
}

.modal.modal-sm {
    width: 420px;
}

.modal.modal-lg {
    width: 900px;
}

.modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.modal-header h3 {
    font-size: 16px;
    font-weight: 600;
}

.modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-light);
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: all 0.2s;
}

.modal-close:hover {
    background: #f0f0f0;
    color: var(--text);
}

.modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
}

.modal-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex-shrink: 0;
}

/* ===== 表单 ===== */
.form-group {
    margin-bottom: 16px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.form-row-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
}

.form-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 5px;
}

.form-label .required {
    color: var(--danger);
    margin-left: 2px;
}

.form-input,
.form-select,
.form-textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg-white);
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 2px rgba(45, 90, 39, 0.08);
}

.form-textarea {
    resize: vertical;
    min-height: 70px;
    line-height: 1.6;
}

.form-hint {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
}

.form-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    margin: 4px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
}

/* ===== 复选框列表 ===== */
.checklist {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
}

.checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
}

.checklist-item:hover {
    background: #f8f9fa;
}

.checklist-item.checked {
    background: var(--success-bg);
    border-color: #c3e6cb;
}

.checklist-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
}

.checklist-item.checked span {
    text-decoration: line-through;
    color: var(--text-light);
}

/* ===== 进度条 ===== */
.progress-bar {
    width: 100%;
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0;
}

.progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 4px;
    transition: width 0.3s;
}

.progress-text {
    font-size: 13px;
    color: var(--text-secondary);
}

.progress-text strong {
    color: var(--primary);
    font-size: 15px;
}

/* ===== 提醒横幅 ===== */
.alert-banner {
    padding: 12px 20px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}

.alert-banner.warning {
    background: var(--warning-bg);
    color: #8a5a00;
    border: 1px solid #f5dab1;
}

.alert-banner.info {
    background: var(--info-bg);
    color: #0c5460;
    border: 1px solid #b8daff;
}

.alert-banner.danger {
    background: var(--danger-bg);
    color: #721c24;
    border: 1px solid #f5c6cb;
}

.alert-banner-icon {
    font-size: 16px;
    flex-shrink: 0;
}

/* ===== 植物卡片 ===== */
.plant-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}

.plant-card {
    background: var(--bg-white);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
}

.plant-card:hover {
    box-shadow: var(--shadow-lg);
    border-color: var(--primary-light);
    transform: translateY(-2px);
}

.plant-card-photo {
    width: 100%;
    height: 160px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

.plant-card-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.plant-card-photo .no-photo {
    font-size: 36px;
    opacity: 0.2;
}

.plant-card-body {
    padding: 12px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.plant-card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
}

.plant-card-sci {
    font-size: 12px;
    color: var(--text-light);
    font-style: italic;
    margin-bottom: 8px;
}

.plant-card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}

.plant-card-footer {
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-light);
}

/* ===== 复习卡片 ===== */
.review-card {
    background: var(--bg-white);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    padding: 24px;
    text-align: center;
    margin-bottom: 16px;
}

.review-card-photo {
    width: 200px;
    height: 200px;
    margin: 0 auto 16px;
    border-radius: 8px;
    overflow: hidden;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.review-card-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.review-card-question {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 12px;
}

.review-card-answer {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
}

.review-card-sci {
    font-size: 14px;
    color: var(--text-light);
    font-style: italic;
    margin-bottom: 16px;
}

.review-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 16px;
}

/* ===== 图片上传 ===== */
.photo-upload {
    display: flex;
    align-items: center;
    gap: 12px;
}

.photo-preview {
    width: 80px;
    height: 80px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #fafafa;
    cursor: pointer;
    position: relative;
}

.photo-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo-preview .upload-placeholder {
    text-align: center;
    color: var(--text-light);
    font-size: 12px;
}

.photo-upload input[type="file"] {
    display: none;
}

.photo-info {
    font-size: 12px;
    color: var(--text-light);
    flex: 1;
}

.photo-remove {
    color: var(--danger);
    cursor: pointer;
    font-size: 12px;
    margin-left: 6px;
}

/* ===== Toast ===== */
.toast {
    position: fixed;
    top: 80px;
    right: 24px;
    padding: 12px 20px;
    background: #333;
    color: #fff;
    border-radius: var(--radius-sm);
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transform: translateX(100px);
    transition: all 0.3s;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
}

.toast.show {
    opacity: 1;
    transform: translateX(0);
}

.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }

/* ===== 图片查看器 ===== */
.image-viewer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    cursor: zoom-out;
    padding: 40px;
}

.image-viewer.show {
    display: flex;
}

.image-viewer img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 4px;
}

/* ===== 设置页 ===== */
.settings-section {
    background: var(--bg-white);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    padding: 20px 24px;
    margin-bottom: 16px;
}

.settings-section h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.settings-section h3::before {
    content: '';
    width: 3px;
    height: 16px;
    background: var(--primary);
    border-radius: 2px;
}

.settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
}

.settings-row:last-child {
    border-bottom: none;
}

.settings-row-label {
    font-size: 13px;
    color: var(--text);
}

.settings-row-desc {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
}

.settings-row input {
    width: 280px;
}

/* ===== 列表项 ===== */
.list-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    gap: 10px;
}

.list-item:last-child {
    border-bottom: none;
}

.list-item-content {
    flex: 1;
}

.list-item-title {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
}

.list-item-desc {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
}

.list-item-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

/* ===== 双栏布局 ===== */
.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* ===== 详情视图 ===== */
.detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
}

.detail-item {
    padding: 6px 0;
}

.detail-label {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 2px;
}

.detail-value {
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
}

.detail-full {
    grid-column: 1 / -1;
}

.detail-photo {
    margin-top: 6px;
}

.detail-photo img {
    max-width: 200px;
    max-height: 150px;
    border-radius: 4px;
    border: 1px solid var(--border);
    cursor: pointer;
}

/* ===== 视图切换 ===== */
.view-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
}

.view-tab {
    padding: 8px 20px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
}

.view-tab:hover {
    color: var(--primary);
}

.view-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
}

/* ===== 统计小卡片 ===== */
.mini-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
}

.mini-stat {
    background: var(--bg-white);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.mini-stat-num {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
}

.mini-stat-label {
    font-size: 13px;
    color: var(--text-secondary);
}

/* ===== 响应式 ===== */
@media (max-width: 1200px) {
    .stat-cards {
        grid-template-columns: repeat(2, 1fr);
    }
    .detail-grid {
        grid-template-columns: 1fr;
    }
}

/* ===== 平板 ===== */
@media (max-width: 900px) {
    .two-col {
        grid-template-columns: 1fr;
    }
    .checklist {
        grid-template-columns: 1fr;
    }
}

/* ===== 手机端 ===== */
@media (max-width: 768px) {
    :root {
        --sidebar-width: 260px;
    }

    body {
        font-size: 14px;
        -webkit-text-size-adjust: 100%;
    }

    /* 汉堡菜单按钮 */
    .menu-toggle {
        display: flex;
    }

    /* 侧边栏改为抽屉式 */
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.28s ease;
        box-shadow: 2px 0 12px rgba(0, 0, 0, 0.2);
    }
    .sidebar.open {
        transform: translateX(0);
    }

    /* 主内容区占满宽度 */
    .main-content {
        margin-left: 0;
    }

    /* 顶栏 */
    .topbar {
        padding: 0 14px;
        height: 50px;
    }
    .page-title {
        font-size: 16px;
    }
    .topbar-date {
        font-size: 12px;
    }

    /* 页面内容减少内边距 */
    .page-content {
        padding: 12px 14px;
    }

    /* 统计卡片 2x2 */
    .stat-cards {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 14px;
    }
    .stat-card {
        padding: 12px 14px;
        gap: 10px;
    }
    .stat-card-icon {
        width: 38px;
        height: 38px;
        font-size: 16px;
        border-radius: 8px;
    }
    .stat-card-info h3 {
        font-size: 20px;
    }
    .stat-card-info p {
        font-size: 12px;
    }

    /* 面板 */
    .panel-header {
        padding: 12px 14px;
    }
    .panel-body {
        padding: 12px 14px;
    }

    /* 快捷按钮 */
    .quick-actions {
        gap: 8px;
        margin-bottom: 14px;
    }
    .quick-btn {
        padding: 8px 12px;
        font-size: 12px;
        flex: 1;
        justify-content: center;
        min-width: calc(50% - 4px);
    }

    /* 工具栏堆叠 */
    .toolbar {
        gap: 8px;
    }
    .toolbar-left {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
    }
    .search-box {
        width: 100%;
    }
    .filter-select {
        width: 100%;
        min-width: 0;
    }
    .toolbar-right {
        width: 100%;
        flex-wrap: wrap;
    }
    .toolbar-right .btn {
        flex: 1;
        justify-content: center;
        min-width: calc(50% - 4px);
    }

    /* 表格横向滚动 */
    .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
    table.data-table {
        font-size: 13px;
    }
    table.data-table th,
    table.data-table td {
        padding: 8px 10px;
    }

    /* 模态框全屏化 */
    .modal-overlay {
        padding-top: 0;
        padding-left: 0;
        padding-right: 0;
    }
    .modal {
        width: 100%;
        max-width: 100%;
        max-height: 100vh;
        border-radius: 0;
        margin-bottom: 0;
    }
    .modal.modal-sm,
    .modal.modal-lg {
        width: 100%;
        max-width: 100%;
    }
    .modal-header {
        padding: 14px 16px;
    }
    .modal-body {
        padding: 14px 16px;
    }
    .modal-footer {
        padding: 12px 16px;
        flex-wrap: wrap;
    }
    .modal-footer .btn {
        flex: 1;
        justify-content: center;
    }

    /* 表单单列 */
    .form-row,
    .form-row-3 {
        grid-template-columns: 1fr;
        gap: 0;
    }
    .form-input,
    .form-select,
    .form-textarea {
        font-size: 15px; /* iOS 防止缩放 */
        padding: 9px 12px;
    }

    /* 复选框列表单列 */
    .checklist {
        grid-template-columns: 1fr;
    }

    /* 双栏单列 */
    .two-col {
        grid-template-columns: 1fr;
    }

    /* 详情网格单列 */
    .detail-grid {
        grid-template-columns: 1fr;
        gap: 8px 0;
    }

    /* 植物卡片单列 */
    .plant-card-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    .plant-card-photo {
        height: 180px;
    }

    /* 复习卡片 */
    .review-card {
        padding: 16px;
    }
    .review-card-photo {
        width: 160px;
        height: 160px;
    }
    .review-card-answer {
        font-size: 20px;
    }
    .review-actions {
        flex-wrap: wrap;
    }
    .review-actions .btn {
        flex: 1;
        justify-content: center;
        min-width: calc(50% - 6px);
    }

    /* 视图切换标签 */
    .view-tab {
        padding: 8px 14px;
        font-size: 13px;
    }

    /* 设置页 */
    .settings-section {
        padding: 14px 16px;
    }
    .settings-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }
    .settings-row input {
        width: 100%;
    }

    /* 迷你统计 */
    .mini-stats {
        flex-wrap: wrap;
        gap: 10px;
    }
    .mini-stat {
        flex: 1;
        min-width: calc(50% - 5px);
        padding: 10px 14px;
    }

    /* Toast 居中显示 */
    .toast {
        top: auto;
        bottom: 30px;
        right: 14px;
        left: 14px;
        text-align: center;
        transform: translateY(100px);
    }
    .toast.show {
        transform: translateY(0);
    }

    /* 图片查看器减少内边距 */
    .image-viewer {
        padding: 10px;
    }

    /* 照片上传 */
    .photo-upload {
        flex-wrap: wrap;
    }

    /* 按钮增大触摸区域 */
    .btn {
        padding: 9px 14px;
    }
    .btn-sm {
        padding: 6px 10px;
    }
    .btn-link {
        padding: 4px 8px;
    }

    /* 列表项 */
    .list-item {
        flex-wrap: wrap;
    }
    .list-item-actions {
        width: 100%;
        justify-content: flex-end;
    }

    /* 侧边栏底部信息 */
    .sidebar-footer {
        padding: 12px 16px;
    }
}

/* ===== 小屏手机 ===== */
@media (max-width: 380px) {
    .stat-cards {
        grid-template-columns: 1fr;
    }
    .quick-btn {
        min-width: 100%;
    }
    .page-title {
        font-size: 15px;
    }
}

GreenApp.storage = (function () {

        tasks: 'green_tasks',

        try {
            var raw = localStorage.getItem(key);

            return true;

            console.error('保存数据失败:', key, e);
            if (e.name === 'QuotaExceededError') {
                alert('浏览器存储空间已满，请导出备份后清理部分数据。');

        for (var i = 0; i < list.length; i++) {
            if (list[i].id === id) return list[i];

        var now = GreenApp.utils ? GreenApp.utils.now() : new Date().toISOString();

        if (data.id) {
            // 更新
            var found = false;
            for (var i = 0; i < list.length; i++) {
                if (list[i].id === data.id) {
                    data.updatedAt = now;
                    data.createdAt = list[i].createdAt || now;
                    list[i] = GreenApp.utils.extend({}, list[i], data);
                    found = true;
                    break;
                }
            }
            if (!found) {
                data.createdAt = now;
                data.updatedAt = now;
                list.push(data);
            }
        } else {
            // 新增
            data.id = GreenApp.utils ? GreenApp.utils.uuid() : Date.now().toString();
            data.createdAt = now;
            data.updatedAt = now;
            list.push(data);
        }
        set(KEYS[module], list);
        return data;
    }

    function remove(module, id) {
        var list = getAll(module);
        var newList = [];
        for (var i = 0; i < list.length; i++) {
            if (list[i].id !== id) newList.push(list[i]);
        }
        set(KEYS[module], newList);
    }

        if (data.settings) {
            set(KEYS.settings, data.settings);
        }
        return true;
    }

    function clearAll() {
        var modules = ['tasks', 'inspection', 'seedling', 'payment', 'security', 'plants'];
        for (var i = 0; i < modules.length; i++) {
            set(KEYS[modules[i]], []);
        }

    }

    function setInitialized() {
        set(KEYS.initialized, true);

/**

window.GreenApp = window.GreenApp || {};

GreenApp.utils = (function () {

    function uuid() {
        return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    }

    function now() {
        return new Date().toISOString();
    }

    function extend(target) {
        for (var i = 1; i < arguments.length; i++) {
            var src = arguments[i];
            if (src) {
                for (var key in src) {
                    if (src.hasOwnProperty(key)) {
                        target[key] = src[key];
                    }
                }
            }
        }
        return target;
    }

    function formatDate(dateStr, withTime) {
        if (!dateStr) return '-';
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        if (withTime) {
            var h = String(d.getHours()).padStart(2, '0');
            var min = String(d.getMinutes()).padStart(2, '0');
            return y + '-' + m + '-' + day + ' ' + h + ':' + min;
        }
        return y + '-' + m + '-' + day;
    }

    function formatDateShort(dateStr) {
        if (!dateStr) return '-';
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return m + '-' + day;
    }

    function today() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
    }

    function currentMonth() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function daysInMonth(yearMonth) {
        if (!yearMonth) return 30;
        var parts = yearMonth.split('-');
        var y = parseInt(parts[0]);
        var m = parseInt(parts[1]);
        return new Date(y, m, 0).getDate();
    }

    function isOverdue(deadline) {
        if (!deadline) return false;
        var d = new Date(deadline);
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        d.setHours(0, 0, 0, 0);
        return d < today;
    }

    function isToday(dateStr) {
        if (!dateStr) return false;
        var d = new Date(dateStr);
        var t = new Date();
        return d.getFullYear() === t.getFullYear() &&
            d.getMonth() === t.getMonth() &&
            d.getDate() === t.getDate();
    }

    function isThisMonth(dateStr) {
        if (!dateStr) return false;
        var d = new Date(dateStr);
        var t = new Date();
        return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function toast(message, type) {
        var el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'toast show ' + (type || '');
        setTimeout(function () {
            el.className = 'toast ' + (type || '');
        }, 2500);
    }

    function confirm(message, onConfirm, title) {
        var overlay = document.getElementById('confirm-overlay');
        document.getElementById('confirm-title').textContent = title || '确认操作';
        document.getElementById('confirm-message').textContent = message;

        var okBtn = document.getElementById('confirm-ok-btn');
        var cancelBtn = document.getElementById('confirm-cancel-btn');

        // 克隆替换，清除旧监听
        var newOk = okBtn.cloneNode(true);
        var newCancel = cancelBtn.cloneNode(true);
        okBtn.parentNode.replaceChild(newOk, okBtn);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

        newOk.addEventListener('click', function () {
            GreenApp.closeConfirm();
            if (onConfirm) onConfirm();
        });
        newCancel.addEventListener('click', function () {
            GreenApp.closeConfirm();
        });

        overlay.style.display = 'flex';
    }

    function exportCSV(filename, headers, rows) {
        var csv = '\uFEFF'; // BOM for Excel
        csv += headers.map(function (h) { return '"' + h + '"'; }).join(',') + '\n';
        rows.forEach(function (row) {
            csv += row.map(function (cell) {
                if (cell === null || cell === undefined) return '""';
                var s = String(cell);
                s = s.replace(/"/g, '""');
                if (s.indexOf(',') !== -1 || s.indexOf('\n') !== -1) {
                    s = '"' + s + '"';
                } else {
                    s = '"' + s + '"';
                }
                return s;
            }).join(',') + '\n';
        });

        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        downloadBlob(blob, filename);
    }

    function exportJSON(filename, data) {
        var json = JSON.stringify(data, null, 2);
        var blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
        downloadBlob(blob, filename);
    }

    function downloadBlob(blob, filename) {
        var link = document.createElement('a');
        var url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 100);
    }

    function readFileAsDataURL(file, callback) {
        var reader = new FileReader();
        reader.onload = function (e) {
            callback(e.target.result);
        };
        reader.readAsDataURL(file);
    }

    function getImageName(dataUrl) {
        if (!dataUrl) return '';
        if (dataUrl.indexOf('data:image') === 0) {
            // 从base64提取信息
            return '已上传图片';
        }
        return dataUrl;
    }

    function daysBetween(startDate, endDate) {
        var s = new Date(startDate);
        var e = new Date(endDate);
        if (isNaN(s.getTime()) || isNaN(e.getTime())) return 0;
        var diff = e.getTime() - s.getTime();
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function calcMonthAmount(quantity, unitPrice, billingDays, totalDays) {
        if (!quantity || !unitPrice || !billingDays || !totalDays) return 0;
        return Math.round(quantity * unitPrice / totalDays * billingDays * 100) / 100;
    }

    return {
        uuid: uuid,
        now: now,
        extend: extend,
        formatDate: formatDate,
        formatDateShort: formatDateShort,
        today: today,
        currentMonth: currentMonth,
        daysInMonth: daysInMonth,
        isOverdue: isOverdue,
        isToday: isToday,
        isThisMonth: isThisMonth,
        escapeHtml: escapeHtml,
        toast: toast,
        confirm: confirm,
        exportCSV: exportCSV,
        exportJSON: exportJSON,
        downloadBlob: downloadBlob,
        readFileAsDataURL: readFileAsDataURL,
        getImageName: getImageName,
        daysBetween: daysBetween,
        calcMonthAmount: calcMonthAmount
    };
})();

GreenApp.app = (function () {

    function toggleSidebar() {
        var sidebar = document.querySelector('.sidebar');
        var backdrop = document.getElementById('sidebar-backdrop');
        if (sidebar) sidebar.classList.toggle('open');
        if (backdrop) backdrop.classList.toggle('show');

    function closeSidebar() {
        var sidebar = document.querySelector('.sidebar');
        var backdrop = document.getElementById('sidebar-backdrop');
        if (sidebar) sidebar.classList.remove('open');
        if (backdrop) backdrop.classList.remove('show');

    function navigate(pageName) {
        currentPage = pageName;

        // 切换导航高亮

            item.classList.toggle('active', item.getAttribute('data-page') === pageName);
        });

        // 切换页面显示
        document.querySelectorAll('.page').forEach(function (p) {
            p.classList.toggle('active', p.id === 'page-' + pageName);
        });

        // 更新标题

            home: GreenApp.home,
            tasks: GreenApp.tasks,
            inspection: GreenApp.inspection,
            seedling: GreenApp.seedling,
            payment: GreenApp.payment,
            security: GreenApp.security,
            plants: GreenApp.plants,
            settings: GreenApp.settings
        };

        if (modules[pageName] && typeof modules[pageName].render === 'function') {
            modules[pageName].render();
        }

        // 手机端导航后关闭侧边栏并回到顶部

        return '<div class="photo-upload">' +
            '<div class="photo-preview" onclick="document.getElementById(\'' + fieldId + '-input\').click()">' +
            '<img id="' + fieldId + '-img" src="' + (hasPhoto ? currentPhoto : '') + '" style="display:' + imgDisplay + '">' +

            '</div>' +

    function bindPhotoUpload(fieldId, callback) {
        var input = document.getElementById(fieldId + '-input');
        if (!input) return;
        input.addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                GreenApp.utils.toast('图片超过2MB，建议压缩后再上传', 'warning');
            }
            GreenApp.utils.readFileAsDataURL(file, function (dataUrl) {
                var img = document.getElementById(fieldId + '-img');
                var placeholder = document.getElementById(fieldId + '-placeholder');
                var nameEl = document.getElementById(fieldId + '-name');
                var removeEl = document.getElementById(fieldId + '-remove');

                img.src = dataUrl;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                nameEl.textContent = file.name;
                removeEl.style.display = 'inline';

                if (callback) callback(dataUrl, file.name);
            });
        });
    }

    function clearPhoto(fieldId) {

        var placeholder = document.getElementById(fieldId + '-placeholder');
        var nameEl = document.getElementById(fieldId + '-name');
        var removeEl = document.getElementById(fieldId + '-remove');
        var input = document.getElementById(fieldId + '-input');

        img.src = '';

            else if (status === '处理中') cls = 'tag-info';
            else if (status === '待反馈') cls = 'tag-warning';
            else if (status === '已完成') cls = 'tag-success';
        } else if (type === 'inspection') {
            if (status === '待整改') cls = 'tag-danger';
            else if (status === '整改中') cls = 'tag-warning';
            else if (status === '待复查') cls = 'tag-info';
            else if (status === '已完成') cls = 'tag-success';
        } else if (type === 'payment') {
            if (status === '资料整理中') cls = 'tag-default';
            else if (status === '正在核对') cls = 'tag-info';
            else if (status === '待审核') cls = 'tag-warning';
            else if (status === '已报送') cls = 'tag-primary';
            else if (status === '已完成') cls = 'tag-success';
        } else if (type === 'plant') {
            if (status === '待学习') cls = 'tag-default';
            else if (status === '初步认识') cls = 'tag-info';
            else if (status === '基本掌握') cls = 'tag-primary';
            else if (status === '熟练识别') cls = 'tag-success';
        } else if (type === 'security') {

GreenApp.tasks = (function () {

    var CATEGORIES = ['现场巡查', '请款核对', '占绿移植', '整改跟踪', '材料编写', '图纸处理', '领导交办', '植物学习', '其他工作'];
    var URGENCIES = ['普通', '重要', '紧急'];
    var STATUSES = ['待处理', '处理中', '待反馈', '已完成'];

    var state = {
        search: '',
        statusFilter: '',
        categoryFilter: '',
        sortBy: 'default'
    };

    var SORT_OPTIONS = [
        { value: 'default', label: '📋 默认排序（进行中优先）' },
        { value: 'plannedDate-asc', label: '📅 计划日期 ↑（早的在前）' },
        { value: 'plannedDate-desc', label: '📅 计划日期 ↓（晚的在前）' },
        { value: 'createdAt-desc', label: '🕐 创建时间 ↓（新的在前）' },
        { value: 'createdAt-asc', label: '🕐 创建时间 ↑（旧的在前）' },

    ];

    var URGENCY_ORDER = { '紧急': 0, '重要': 1, '普通': 2 };
    var STATUS_ORDER = { '待处理': 0, '处理中': 1, '待反馈': 2, '已完成': 3 };

    function render() {

        STATUSES.forEach(function (s) {
            html += '<option value="' + s + '"' + (state.statusFilter === s ? ' selected' : '') + '>' + s + '</option>';
        });
        html += '</select>';
        html += '<select class="filter-select" onchange="GreenApp.tasks.onFilter(\'category\', this.value)">';
        html += '<option value="">全部类别</option>';
        CATEGORIES.forEach(function (c) {
            html += '<option value="' + c + '"' + (state.categoryFilter === c ? ' selected' : '') + '>' + c + '</option>';
        });
        html += '</select>';
        html += '<select class="filter-select" onchange="GreenApp.tasks.onSort(this.value)" title="排序方式">';
        SORT_OPTIONS.forEach(function (o) {
            html += '<option value="' + o.value + '"' + (state.sortBy === o.value ? ' selected' : '') + '>' + o.label + '</option>';
        });
        html += '</select>';
        html += '</div>';
        html += '<div class="toolbar-right">';
        html += '<button class="btn btn-default" onclick="GreenApp.tasks.exportCSV()">导出CSV</button>';

        html += '</div>';

        html += '<div class="panel"><div class="panel-body no-padding"><div class="table-wrapper">';
        if (sorted.length === 0) {
            html += '<div class="empty-state"><div class="empty-state-icon">📋</div>暂无工作记录</div>';
        } else {
            html += '<table class="data-table"><thead><tr>';
            html += '<th>任务名称</th><th>工作类别</th><th>所属项目</th><th>紧急程度</th><th>状态</th><th>计划日期</th><th>反馈</th><th>操作</th>';
            html += '</tr></thead><tbody>';
            sorted.forEach(function (t) {
                var urgencyClass = t.urgency === '紧急' ? 'urgency-urgent' : (t.urgency === '重要' ? 'urgency-important' : 'urgency-normal');
                var rowStyle = t.status === '已完成' ? ' style="opacity:0.55;"' : '';

            html += '</tbody></table>';
        }
        html += '</div></div></div>';

        document.getElementById('page-tasks').innerHTML = html;
    }

    function filterTasks(tasks) {
        return tasks.filter(function (t) {
            var matchSearch = true;
            if (state.search) {
                var s = state.search.toLowerCase();
                matchSearch = (t.taskName && t.taskName.toLowerCase().indexOf(s) !== -1) ||
                    (t.location && t.location.toLowerCase().indexOf(s) !== -1) ||
                    (t.project && t.project.toLowerCase().indexOf(s) !== -1);
            }
            var matchStatus = !state.statusFilter || t.status === state.statusFilter;
            var matchCategory = !state.categoryFilter || t.workCategory === state.categoryFilter;
            return matchSearch && matchStatus && matchCategory;
        });
    }

    function sortTasks(tasks) {
        // 始终先复制一份再排序，避免污染原数组
        var arr = tasks.slice();
        switch (state.sortBy) {
            case 'plannedDate-asc':
                arr.sort(function (a, b) {
                    // 空日期排到末尾
                    if (!a.plannedDate && !b.plannedDate) return 0;
                    if (!a.plannedDate) return 1;
                    if (!b.plannedDate) return -1;
                    return a.plannedDate.localeCompare(b.plannedDate);
                });
                break;
            case 'plannedDate-desc':
                arr.sort(function (a, b) {
                    if (!a.plannedDate && !b.plannedDate) return 0;
                    if (!a.plannedDate) return 1;
                    if (!b.plannedDate) return -1;
                    return b.plannedDate.localeCompare(a.plannedDate);
                });
                break;
            case 'createdAt-desc':
                arr.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
                break;
            case 'createdAt-asc':
                arr.sort(function (a, b) { return (a.createdAt || '').localeCompare(b.createdAt || ''); });
                break;
            case 'urgency':
                arr.sort(function (a, b) {
                    var oa = URGENCY_ORDER[a.urgency] != null ? URGENCY_ORDER[a.urgency] : 99;
                    var ob = URGENCY_ORDER[b.urgency] != null ? URGENCY_ORDER[b.urgency] : 99;
                    if (oa !== ob) return oa - ob;
                    // 紧急程度相同则按创建时间倒序
                    return (b.createdAt || '').localeCompare(a.createdAt || '');
                });
                break;
            case 'status':
                arr.sort(function (a, b) {
                    var oa = STATUS_ORDER[a.status] != null ? STATUS_ORDER[a.status] : 99;
                    var ob = STATUS_ORDER[b.status] != null ? STATUS_ORDER[b.status] : 99;
                    if (oa !== ob) return oa - ob;
                    return (b.createdAt || '').localeCompare(a.createdAt || '');
                });
                break;
            default:
                // 默认：未完成优先 + 紧急程度 + 创建时间倒序
                arr.sort(function (a, b) {
                    var aDone = a.status === '已完成' ? 1 : 0;
                    var bDone = b.status === '已完成' ? 1 : 0;
                    if (aDone !== bDone) return aDone - bDone;
                    var oa = URGENCY_ORDER[a.urgency] != null ? URGENCY_ORDER[a.urgency] : 99;
                    var ob = URGENCY_ORDER[b.urgency] != null ? URGENCY_ORDER[b.urgency] : 99;
                    if (oa !== ob) return oa - ob;
                    return (b.createdAt || '').localeCompare(a.createdAt || '');
                });
        }
        return arr;
    }

        state.search = val;

        if (type === 'status') state.statusFilter = val;
        if (type === 'category') state.categoryFilter = val;

        html += '</div>';

        html += '<div class="form-group"><label class="form-label">具体位置</label>';
        html += '<input type="text" class="form-input" id="f-location" value="' + GreenApp.utils.escapeHtml(data.location || '') + '"></div>';
        html += '<div class="form-group"><label class="form-label">紧急程度</label>';

        html += GreenApp.app.selectOptions(URGENCIES, data.urgency || '普通');

        var data = GreenApp.storage.getById('tasks', id);

        var html = getFormHTML(data);
        var footer = '<button class="btn btn-default" onclick="GreenApp.closeModal()">取消</button>' +

        GreenApp.app.openModal('编辑工作任务', html, footer);
    }

    function openDetail(id) {
        var t = GreenApp.storage.getById('tasks', id);
        if (!t) return;
        var html = '<div class="detail-grid">';
        html += detailItem('任务名称', t.taskName, true);
        html += detailItem('工作类别', t.workCategory);
        html += detailItem('所属项目', t.project);
        html += detailItem('具体位置', t.location);
        html += detailItem('紧急程度', t.urgency);
        html += detailItem('计划完成日期', GreenApp.utils.formatDate(t.plannedDate));
        html += detailItem('当前状态', '', false, GreenApp.app.statusTag(t.status, 'task'));
        html += detailItem('需要向领导反馈', t.needFeedback);
        html += detailItem('相关文件路径', t.filePath);
        html += detailItem('工作记录', t.workRecord, true);
        html += detailItem('备注', t.remarks, true);
        html += detailItem('创建时间', GreenApp.utils.formatDate(t.createdAt, true));
        html += detailItem('最后修改', GreenApp.utils.formatDate(t.updatedAt, true));
        if (t.completedAt) html += detailItem('完成时间', GreenApp.utils.formatDate(t.completedAt, true));

        GreenApp.app.openModal('任务详情', html, footer);

    function detailItem(label, value, full, customHTML) {
        return '<div class="detail-item' + (full ? ' detail-full' : '') + '">' +
            '<div class="detail-label">' + label + '</div>' +
            '<div class="detail-value">' + (customHTML || GreenApp.utils.escapeHtml(value || '-')) + '</div>' +
            '</div>';
    }

    function save(id) {
        var data = getFormData();
        if (!data.taskName) {
            GreenApp.utils.toast('请输入任务名称', 'error');
            return;
        }
        if (id) {
            data.id = id;
            var existing = GreenApp.storage.getById('tasks', id);
            if (existing && existing.status !== '已完成' && data.status === '已完成') {
                data.completedAt = GreenApp.utils.now();
            } else if (existing) {
                data.completedAt = existing.completedAt;
            }
        }
        GreenApp.storage.save('tasks', data);
        GreenApp.closeModal();
        GreenApp.utils.toast('保存成功', 'success');
        render();
        GreenApp.app.renderSidebarFooter();
    }

    function quickComplete(id) {
        var t = GreenApp.storage.getById('tasks', id);
        if (!t) return;
        GreenApp.utils.confirm('确认将任务「' + t.taskName + '」标记为已完成？', function () {
            t.status = '已完成';
            t.completedAt = GreenApp.utils.now();
            GreenApp.storage.save('tasks', t);
            GreenApp.utils.toast('已完成', 'success');
            render();
        });
    }

    function deleteRecord(id) {
        var t = GreenApp.storage.getById('tasks', id);
        if (!t) return;
        GreenApp.utils.confirm('确认删除任务「' + t.taskName + '」？此操作不可撤销。', function () {
            GreenApp.storage.remove('tasks', id);
            GreenApp.utils.toast('已删除', 'success');
            render();
        });
    }

    function exportCSV() {
        var tasks = GreenApp.storage.getAll('tasks');
        if (tasks.length === 0) {
            GreenApp.utils.toast('暂无数据可导出', 'warning');
            return;
        }
        var headers = ['任务名称', '工作类别', '所属项目', '具体位置', '紧急程度', '计划完成日期', '当前状态', '需要反馈', '工作记录', '文件路径', '备注', '创建时间', '修改时间'];
        var rows = tasks.map(function (t) {
            return [t.taskName, t.workCategory, t.project, t.location, t.urgency, t.plannedDate, t.status, t.needFeedback, t.workRecord, t.filePath, t.remarks, t.createdAt, t.updatedAt];
        });
        GreenApp.utils.exportCSV('今日工作_' + GreenApp.utils.today() + '.csv', headers, rows);
        GreenApp.utils.toast('导出成功', 'success');
    }

    return {
        render: render,
        onSearch: onSearch,
        onFilter: onFilter,
        onSort: onSort,
        openCreate: openCreate,
        openEdit: openEdit,
        openDetail: openDetail,
        save: save,
        quickComplete: quickComplete,
        delete: deleteRecord,
        exportCSV: exportCSV
    };
})();

        }
        html += '</div></div></div>';

        document.getElementById('page-inspection').innerHTML = html;

    function filterList(list) {
        return list.filter(function (i) {
            var matchSearch = true;
            if (state.search) {
                var s = state.search.toLowerCase();
                matchSearch = (i.location && i.location.toLowerCase().indexOf(s) !== -1) ||
                    (i.problemDesc && i.problemDesc.toLowerCase().indexOf(s) !== -1) ||
                    (i.projectName && i.projectName.toLowerCase().indexOf(s) !== -1);
            }
            var matchStatus = !state.statusFilter || i.status === state.statusFilter;
            var matchType = !state.typeFilter || i.problemType === state.typeFilter;
            return matchSearch && matchStatus && matchType;
        });
    }

    function onSearch(val) {
        state.search = val;

    // ========== 备忘录用印相关 ==========

    function memoTagHTML(memo) {
        if (!memo || !memo.hasMemo) return '<span style="color:#999;font-size:12px;">未制作</span>';
        var done = 0;
        SEAL_STEPS.forEach(function (step) {
            if (memo[step.key] === 'done') done++;
        });
        if (done === 3 && memo.scanned) return '<span class="tag tag-success">✅ 全部完成</span>';
        if (done === 3) return '<span class="tag tag-primary">3章已盖<br><span style="font-size:10px;">待扫描留底</span></span>';
        if (done === 2) return '<span class="tag tag-warning">2/3章<br><span style="font-size:10px;">待园林中心章</span></span>';
        if (done === 1) return '<span class="tag tag-info">1/3章</span>';
        return '<span class="tag tag-default">0/3章<br><span style="font-size:10px;">待用印</span></span>';
    }

    function computeMemoStats(list) {
        var stats = { hasMemoCount: 0, pendingSealCount: 0, allSealDoneCount: 0, scannedCount: 0, pendingContractor: 0, pendingOurSeal: 0, pendingGardenCenter: 0 };
        list.forEach(function (s) {
            var memo = s.memo;
            if (!memo || !memo.hasMemo) return;
            stats.hasMemoCount++;
            var doneCount = 0;
            SEAL_STEPS.forEach(function (step) {
                if (memo[step.key] === 'done') doneCount++;
                else {
                    if (step.key === 'contractorSeal') stats.pendingContractor++;
                    if (step.key === 'ourSeal') stats.pendingOurSeal++;
                    if (step.key === 'gardenCenterSeal') stats.pendingGardenCenter++;
                }
            });
            if (doneCount < 3) stats.pendingSealCount++;
            if (doneCount === 3) stats.allSealDoneCount++;
            if (memo.scanned) stats.scannedCount++;
        });
        return stats;
    }

    function sealProgressHTML(memo) {
        if (!memo || !memo.hasMemo) return '<div style="color:#999;font-size:13px;">尚未制作备忘录</div>';

        var html = '<div style="display:flex;align-items:center;gap:4px;margin-bottom:10px;">';
        SEAL_STEPS.forEach(function (step, i) {
            var isDone = memo[step.key] === 'done';
            var circleStyle = isDone
                ? 'background:#28a745;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;'
                : 'background:#e0e0e0;color:#999;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;';
            html += '<div style="' + circleStyle + '">' + step.icon + '</div>';
            if (i < 2) {
                var lineColor = isDone ? '#28a745' : '#e0e0e0';
                var nextDone = memo[SEAL_STEPS[i + 1].key] === 'done';
                html += '<div style="width:20px;height:2px;background:' + (isDone && nextDone ? '#28a745' : '#e0e0e0') + ';"></div>';
            }
        });
        html += '</div>';

        html += '<div style="font-size:13px;">';
        SEAL_STEPS.forEach(function (step) {
            var isDone = memo[step.key] === 'done';
            var dateField = step.key + 'Date';
            var dateVal = memo[dateField] || '';
            if (isDone) {
                html += '<div style="color:#28a745;margin-bottom:4px;">✅ ' + step.label + ' — 已盖章' + (dateVal ? '（' + dateVal + '）' : '') + '</div>';
            } else {
                var isGarden = step.key === 'gardenCenterSeal';
                var warnStyle = isGarden ? 'color:#dc3545;font-weight:bold;' : 'color:#e8922d;';
                html += '<div style="' + warnStyle + 'margin-bottom:4px;">⏳ ' + step.label + ' — 待盖章' + (isGarden ? '（通常周期较长）' : '') + '</div>';
            }
        });

        // 扫描留底
        if (memo.scanned) {
            html += '<div style="color:#28a745;margin-top:8px;">✅ 已扫描留底' + (memo.scanDate ? '（' + memo.scanDate + '）' : '') + '</div>';
        } else {
            var allDone = SEAL_STEPS.every(function (step) { return memo[step.key] === 'done'; });
            if (allDone) {
                html += '<div style="color:#e8922d;margin-top:8px;font-weight:bold;">⚠️ 用印已完成，待扫描留底</div>';
            } else {
                html += '<div style="color:#999;margin-top:8px;">未扫描留底</div>';
            }
        }

        html += '</div>';
        return html;
    }

            html += '</div>';
            html += '</div>';
        });

        html += '<div class="form-row" style="margin-top:12px;border-top:1px dashed #e0e0e0;padding-top:12px;">';
        html += '<div class="form-group" style="flex:0 0 auto;display:flex;align-items:center;gap:8px;">';
        html += '<input type="checkbox" id="f-scanned" ' + (memo.scanned ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:#28a745;">';
        html += '<label style="font-size:13px;font-weight:bold;color:#2d5a27;">扫描留底</label>';
        html += '</div>';
        html += '<div class="form-group" style="flex:1;">';
        html += '<label class="form-label" style="font-size:12px;">扫描日期</label>';
        html += '<input type="date" class="form-input" id="f-scanDate" value="' + (memo.scanDate || '') + '">';
        html += '</div>';
        html += '</div>';
        html += '</div>';

        html += '<div class="form-group"><label class="form-label">备忘录跟进备注</label>';
        html += '<textarea class="form-textarea" id="f-memoNotes" rows="2" placeholder="如：园林中心章预计还需2周，已催办...">' + GreenApp.utils.escapeHtml(memo.memoNotes || '') + '</textarea></div>';
        html += '</div>';

        return html;
    }

    function toggleMemoForm() {
        var checked = document.getElementById('f-hasMemo').checked;
        var section = document.getElementById('memo-seal-section');
        var dateGroup = document.getElementById('memo-date-group');
        if (section) section.style.display = checked ? '' : 'none';
        if (dateGroup) dateGroup.style.display = checked ? '' : 'none';
    }

    function getMemoFormData() {
        var hasMemo = document.getElementById('f-hasMemo') ? document.getElementById('f-hasMemo').checked : false;
        var memo = { hasMemo: hasMemo };
        if (hasMemo) {
            memo.memoDate = document.getElementById('f-memoDate') ? document.getElementById('f-memoDate').value : '';
            SEAL_STEPS.forEach(function (step) {
                var checkbox = document.getElementById('f-' + step.key);
                memo[step.key] = checkbox && checkbox.checked ? 'done' : 'pending';
                memo[step.key + 'Date'] = document.getElementById('f-' + step.key + 'Date') ? document.getElementById('f-' + step.key + 'Date').value : '';
            });
            memo.scanned = document.getElementById('f-scanned') ? document.getElementById('f-scanned').checked : false;
            memo.scanDate = document.getElementById('f-scanDate') ? document.getElementById('f-scanDate').value : '';
            memo.memoNotes = document.getElementById('f-memoNotes') ? document.getElementById('f-memoNotes').value.trim() : '';
        }
        return memo;
    }

    function progressTagHTML(p) {
        if (p === '占绿中') return '<span class="tag tag-warning">占绿中</span>';
        if (p === '已结束') return '<span class="tag tag-success">已结束</span>';
        if (p === '待开始') return '<span class="tag tag-default">待开始</span>';
        return '<span class="tag tag-default">-</span>';
    }

    function formatOccupationTime(s) {
        if (!s.startDate && !s.endDate) return '-';
        var start = s.startDate || '?';
        var end = s.endDate || '?';
        return start + '<br><span style="color:#999;font-size:11px;">至 ' + end + '</span>';
    }

    function computeStats(list) {
        var stats = { totalTrees: 0, roadCount: 0, nonRoadCount: 0, shrubCount: 0, totalArea: 0 };
        list.forEach(function (s) {
            stats.totalArea += parseFloat(s.area) || 0;
            (s.seedlings || []).forEach(function (sd) {
                stats.totalTrees++;
                if (sd.treeType === 'road') stats.roadCount++;
                else if (sd.treeType === 'nonRoad') stats.nonRoadCount++;
                else if (sd.treeType === 'shrub') stats.shrubCount++;
            });
        });
        return stats;
    }

    function filterList(list) {
        return list.filter(function (s) {
            var matchSearch = true;
            if (state.search) {
                var kw = state.search.toLowerCase();
                matchSearch = (s.applicantUnit && s.applicantUnit.toLowerCase().indexOf(kw) !== -1) ||
                    (s.projectName && s.projectName.toLowerCase().indexOf(kw) !== -1) ||
                    (s.roadName && s.roadName.toLowerCase().indexOf(kw) !== -1);
            }
            var matchAttr = !state.attributeFilter || s.attribute === state.attributeFilter;
            var matchProgress = !state.progressFilter || s.progress === state.progressFilter;
            return matchSearch && matchAttr && matchProgress;
        });
    }

    function onSearch(val) {
        state.search = val;
        render();
    }

    function onFilter(type, val) {
        if (type === 'attribute') state.attributeFilter = val;
        if (type === 'progress') state.progressFilter = val;
        render();
    }

    function openDetail(id) {
        var p = GreenApp.storage.getById('payment', id);

        var checked = 0;

        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;">';

        var footer = '<button class="btn btn-default" onclick="GreenApp.closeModal()">关闭</button>' +
            '<button class="btn btn-primary" onclick="GreenApp.closeModal();GreenApp.payment.openEdit(\'' + id + '\')">编辑</button>';
        GreenApp.app.openModal('请款核对详情', html, footer, 'modal-lg');
    }

    function detailItem(label, value, full, customHTML) {
        return '<div class="detail-item' + (full ? ' detail-full' : '') + '">' +
            '<div class="detail-label">' + label + '</div>' +
            '<div class="detail-value">' + (customHTML || GreenApp.utils.escapeHtml(value || '-')) + '</div>' +

    }

    function save(id) {
        var data = getFormData();
        if (!data.paymentMonth) {
            GreenApp.utils.toast('请选择请款月份', 'error');
            return;
        }
        if (id) data.id = id;
        GreenApp.storage.save('payment', data);
        GreenApp.closeModal();
        GreenApp.utils.toast('保存成功', 'success');
        render();
    }

    function deleteRecord(id) {
        var p = GreenApp.storage.getById('payment', id);
        if (!p) return;
        GreenApp.utils.confirm('确认删除请款核对记录「' + (p.paymentMonth || '') + ' ' + (p.projectName || '') + '」？此操作不可撤销。', function () {
            GreenApp.storage.remove('payment', id);
            GreenApp.utils.toast('已删除', 'success');
            render();
        });
    }

    function exportCSV() {
        var list = GreenApp.storage.getAll('payment');
        if (list.length === 0) {
            GreenApp.utils.toast('暂无数据可导出', 'warning');
            return;
        }
        var headers = ['请款月份', '项目名称', '本期申报金额', '核定金额', '扣款金额', '当前状态', '经办人', '核对进度', '核对说明', '备注', '创建时间', '修改时间'];
        var rows = list.map(function (p) {
            var checked = 0;
            if (p.checklist) p.checklist.forEach(function (c) { if (c) checked++; });
            return [p.paymentMonth, p.projectName, p.declaredAmount, p.approvedAmount, p.deductionAmount, p.status, p.operator, checked + '/' + CHECKLIST.length, p.checkNotes, p.remarks, p.createdAt, p.updatedAt];
        });
        GreenApp.utils.exportCSV('请款核对_' + GreenApp.utils.today() + '.csv', headers, rows);
        GreenApp.utils.toast('导出成功', 'success');
    }

    return {
        render: render,
        onSearch: onSearch,
        onFilter: onFilter,
        openCreate: openCreate,
        openEdit: openEdit,
        openDetail: openDetail,
        save: save,
        delete: deleteRecord,
        exportCSV: exportCSV,
        updateChecklistStyle: updateChecklistStyle
    };
})();
